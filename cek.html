<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FastProduction - RLS Diagnostic</title>
<style>
body{background:#101510;color:#e5eee5;font:14px monospace;padding:20px}
h2{color:#8de5a0}
button{padding:12px;background:#286b3a;color:white;border:0;border-radius:6px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b241d;padding:14px;border-radius:8px}
</style>
</head>
<body>
<h2>FastProduction RLS Diagnostic</h2>
<p>Pemeriksaan akses Supabase tanpa mengubah data.</p>
<button id="run">JALANKAN DIAGNOSTIK</button>
<pre id="out">Menunggu...</pre>

<script src="assets/js/supabase.js"></script>
<script>
const out = document.getElementById('out');

function log(title, value) {
  out.textContent += '\n\n===== ' + title + ' =====\n';
  out.textContent += typeof value === 'string'
    ? value
    : JSON.stringify(value, null, 2);
}

document.getElementById('run').onclick = async () => {
  out.textContent = 'Memulai pemeriksaan...';

  try {
    const db = window.fpSupabase;

    if (!db) {
      log('CLIENT', 'window.fpSupabase tidak ditemukan. Periksa supabase.js.');
      return;
    }

    log('CLIENT', 'Supabase client tersedia.');

    const { data: sessionData, error: sessionError } =
      await db.auth.getSession();

    if (sessionError) log('SESSION ERROR', sessionError);
    else {
      const user = sessionData.session?.user;
      log('AUTH SESSION', user ? {
        logged_in: true,
        user_id: user.id,
        email: user.email
      } : { logged_in: false });
    }

    const { data: userData, error: userError } =
      await db.auth.getUser();

    log('AUTH USER', userError || {
      user_id: userData.user?.id || null,
      authenticated: !!userData.user
    });

    const { data: designs, error: designsError } =
      await db.from('designs')
        .select('id,company_id,name,front_image_url,back_image_url,detail_image_url')
        .limit(3);

    log('DESIGNS SELECT', designsError || {
      success: true,
      rows_returned: designs?.length,
      rows: designs
    });

    const { data: bucket, error: bucketError } =
      await db.storage.from('design-assets').list('', { limit: 5 });

    log('STORAGE BUCKET READ', bucketError || {
      success: true,
      files_returned: bucket?.length,
      files: bucket?.map(x => x.name)
    });

    log('SELESAI', 'Pemeriksaan selesai. Tidak ada data yang diubah.');

  } catch (err) {
    log('UNEXPECTED ERROR', {
      message: err.message,
      stack: err.stack
    });
  }
};
</script>
</body>
</html>
