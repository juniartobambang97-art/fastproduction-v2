<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FastProduction — City of Fashion</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================
       BASE STYLES & MOBILE FIXES
       ========================================= */
    :root {
      --color-bg: #030508;
      --color-primary: #00ffcc;
      --color-primary-dark: #007a61;
      --color-secondary: #ff0055;
      --color-text: #e0f7fa;
      --color-text-muted: #6a8c8a;
      --color-panel: rgba(4, 12, 16, 0.85);
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-tap-highlight-color: transparent;
    }

    /* Gunakan 100dvh agar pas di Safari/Chrome Mobile */
    body, html {
      width: 100%; 
      height: 100dvh; 
      overflow: hidden;
      background-color: var(--color-bg);
      font-family: var(--font-body);
      color: var(--color-text);
    }

    /* =========================================
       CANVAS WORLD
       ========================================= */
    #game-world {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    /* =========================================
       GLOBAL UI LAYER
       ========================================= */
    #ui-layer {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 10;
      pointer-events: none;
      display: flex; flex-direction: column;
      padding: 1.5rem;
    }

    /* =========================================
       1. INITIAL LOADING SCREEN
       ========================================= */
    #initial-loader {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--color-bg); z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 1s ease;
    }

    .loader-logo {
      font-family: var(--font-title);
      font-size: 2rem; font-weight: 900;
      color: #fff; letter-spacing: 3px;
      text-shadow: 0 0 20px var(--color-primary);
      margin-bottom: 20px;
      animation: pulseGlow 2s infinite alternate;
      text-align: center;
    }

    .loader-bar-container {
      width: 80%; max-width: 300px; height: 4px;
      background: rgba(0, 255, 204, 0.1);
      border-radius: 2px; overflow: hidden;
      position: relative;
    }

    .loader-bar {
      width: 0%; height: 100%;
      background: var(--color-primary);
      box-shadow: 0 0 15px var(--color-primary);
      transition: width 0.1s linear;
    }

    .loader-text {
      margin-top: 15px; font-family: var(--font-title);
      font-size: 0.7rem; color: var(--color-primary);
      letter-spacing: 2px; text-align: center;
    }

    /* =========================================
       HEADER & STATUS
       ========================================= */
    .game-header {
      display: flex; flex-direction: column;
      gap: 0.2rem; pointer-events: auto;
      opacity: 0; transition: opacity 1s;
    }

    .logo-container {
      font-family: var(--font-title);
      font-size: 1.5rem; font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px var(--color-primary);
      line-height: 1;
    }

    .logo-fast { color: var(--color-primary); }
    
    .world-title {
      font-family: var(--font-title);
      font-size: 0.65rem; letter-spacing: 4px;
      color: var(--color-text-muted);
      border-left: 2px solid var(--color-primary);
      padding-left: 8px;
      margin-top: 5px;
    }

    .server-status {
      position: absolute; top: 1.5rem; right: 1.5rem;
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-title); font-size: 0.65rem;
      color: var(--color-primary);
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 10px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      border-radius: 4px; backdrop-filter: blur(5px);
      opacity: 0; transition: opacity 1s;
    }

    .status-dot {
      width: 6px; height: 6px;
      background-color: var(--color-primary);
      border-radius: 50%; box-shadow: 0 0 10px var(--color-primary);
      animation: pulse 2s infinite;
    }

    /* =========================================
       2. LOGIN PANEL (Responsive)
       ========================================= */
    .login-container {
      position: absolute; 
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 90%; max-width: 380px; 
      pointer-events: auto;
      opacity: 0; 
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .login-container.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .hud-panel {
      background: var(--color-panel);
      border: 1px solid rgba(0, 255, 204, 0.3);
      border-radius: 8px; 
      padding: 25px 20px;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(0, 255, 204, 0.05);
      backdrop-filter: blur(12px);
    }

    .hud-panel::before, .hud-panel::after {
      content: ''; position: absolute;
      width: 20px; height: 20px;
      border: 2px solid var(--color-primary);
    }
    .hud-panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .hud-panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    .panel-title {
      font-family: var(--font-title); font-size: 1rem;
      color: var(--color-primary); text-align: center;
      margin-bottom: 20px; letter-spacing: 2px;
      text-transform: uppercase;
    }

    .input-group { margin-bottom: 15px; }
    .input-group label {
      display: block; font-size: 0.65rem;
      color: var(--color-text-muted); margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .input-group input {
      width: 100%; background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 204, 0.3);
      color: #fff; padding: 12px 15px;
      font-family: var(--font-body); font-size: 0.95rem;
      border-radius: 4px; outline: none; transition: 0.3s;
    }

    .input-group input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
    }

    .form-options {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 20px;
      font-size: 0.75rem;
    }

    .checkbox-container { display: flex; align-items: center; cursor: pointer; color: var(--color-text-muted); }
    .checkbox-container input { display: none; }
    .checkmark {
      width: 14px; height: 14px; border: 1px solid var(--color-text-muted);
      border-radius: 3px; margin-right: 6px; display: flex;
      align-items: center; justify-content: center; transition: 0.3s;
    }
    .checkbox-container input:checked ~ .checkmark {
      background: var(--color-primary); border-color: var(--color-primary);
      box-shadow: 0 0 10px var(--color-primary);
    }
    .checkbox-container input:checked ~ .checkmark::after {
      content: '✓'; color: #000; font-weight: bold; font-size: 10px;
    }

    .forgot-link { color: var(--color-primary); text-decoration: none; }

    .btn {
      width: 100%; padding: 12px; font-family: var(--font-title);
      font-size: 0.9rem; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px; border: none; border-radius: 4px;
      cursor: pointer; transition: 0.3s; position: relative;
      display: flex; justify-content: center; align-items: center; height: 45px;
    }

    .btn-primary {
      background: linear-gradient(45deg, var(--color-primary-dark), var(--color-primary));
      color: #000; box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
      margin-bottom: 10px;
    }

    .btn-secondary { background: transparent; color: var(--color-text); border: 1px solid var(--color-text-muted); }

    .spinner {
      display: none; width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.3); border-top-color: #000;
      border-radius: 50%; animation: spin 1s linear infinite;
    }

    /* =========================================
       3. CHARACTER SELECTION SCREEN
       ========================================= */
    #character-select {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(10, 20, 25, 0.95), #030508);
      z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 1s;
      padding: 20px;
    }

    #character-select.active { opacity: 1; pointer-events: auto; }

    .char-select-title {
      font-family: var(--font-title); font-size: 1.2rem;
      color: #fff; margin-bottom: 30px; letter-spacing: 3px;
      text-shadow: 0 0 20px var(--color-primary);
      animation: float 3s ease-in-out infinite;
      text-align: center;
    }

    .character-card {
      display: flex; flex-direction: column;
      align-items: center; gap: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 204, 0.4);
      padding: 30px 20px; border-radius: 12px;
      position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      width: 100%; max-width: 320px;
    }

    .character-avatar {
      width: 100px; height: 100px;
      background: #0a1218;
      border: 2px solid var(--color-primary);
      border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
      font-size: 3rem; color: var(--color-primary);
      box-shadow: 0 0 40px rgba(0, 255, 204, 0.3);
      position: relative; overflow: hidden;
    }

    .character-name {
      font-family: var(--font-title); font-size: 1.2rem;
      color: #fff; text-transform: uppercase; text-align: center;
      word-break: break-all;
    }

    .character-role {
      font-size: 0.8rem; color: var(--color-primary);
      letter-spacing: 2px; font-weight: 600;
    }

    .btn-enter-world {
      background: transparent; color: var(--color-primary);
      border: 2px solid var(--color-primary);
      padding: 12px 30px; font-family: var(--font-title);
      font-size: 1rem; margin-top: 15px; cursor: pointer;
      transition: 0.3s; position: relative;
      overflow: hidden; width: 100%;
    }

    /* ANIMATIONS */
    @keyframes pulseGlow { 0% { text-shadow: 0 0 10px var(--color-primary); } 100% { text-shadow: 0 0 30px var(--color-primary), 0 0 50px var(--color-primary); } }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.5); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
    @keyframes shine { 100% { left: 200%; } }

    /* =========================================
       DESKTOP LAYOUT (Min-width 768px)
       ========================================= */
    @media (min-width: 768px) {
      #ui-layer { padding: 2rem; }
      
      .game-header { gap: 0.5rem; }
      .logo-container { font-size: 2.5rem; }
      .world-title { font-size: 1rem; letter-spacing: 8px; margin-top: 0; }
      
      .server-status {
        top: 2rem; right: 2rem;
        gap: 10px; font-size: 0.8rem; padding: 8px 15px;
      }
      .status-dot { width: 8px; height: 8px; }

      .login-container {
        width: 400px;
      }
      
      .hud-panel { padding: 40px; }
      .hud-panel::before, .hud-panel::after { width: 30px; height: 30px; border-width: 3px; }
      
      .panel-title { font-size: 1.2rem; margin-bottom: 30px; letter-spacing: 3px; }
      
      .input-group { margin-bottom: 20px; }
      .input-group label { font-size: 0.75rem; margin-bottom: 8px; }
      .input-group input { font-size: 1rem; }

      .form-options { margin-bottom: 25px; font-size: 0.85rem; }
      .checkmark { width: 16px; height: 16px; }
      
      .btn { height: 50px; font-size: 1.1rem; letter-spacing: 2px; }
      .btn-primary { margin-bottom: 15px; }

      .char-select-title { font-size: 2rem; margin-bottom: 60px; letter-spacing: 5px; }
      .character-card { padding: 50px 80px; width: auto; }
      .character-avatar { width: 160px; height: 160px; font-size: 5rem; }
      .character-name { font-size: 1.8rem; }
      .character-role { font-size: 1rem; letter-spacing: 3px; }
      .btn-enter-world { padding: 15px 50px; font-size: 1.2rem; margin-top: 30px; }
    }
  </style>
</head>
<body>

  <!-- 1. INITIAL LOADING SCREEN -->
  <div id="initial-loader">
    <div class="loader-logo">FASTPRODUCTION</div>
    <div class="loader-bar-container">
      <div class="loader-bar" id="loadProgress"></div>
    </div>
    <div class="loader-text" id="loadText">CONNECTING TO SERVER...</div>
  </div>

  <!-- CANVAS WORLD -->
  <canvas id="game-world"></canvas>

  <!-- MAIN UI -->
  <div id="ui-layer" style="display: none;">
    
    <!-- Header -->
    <div class="game-header" id="mainHeader">
      <div class="logo-container">
        <span class="logo-fast">FAST</span><span>PRODUCTION</span>
      </div>
      <div class="world-title">CITY OF FASHION</div>
    </div>

    <!-- Server Status -->
    <div class="server-status" id="mainStatus">
      <div class="status-dot"></div>
      <span>ONLINE | 24ms</span>
    </div>

    <!-- LOGIN PANEL -->
    <div class="login-container" id="login-panel">
      <div class="hud-panel">
        <div class="panel-title">SYSTEM LOGIN</div>
        
        <form id="loginForm">
          <div class="input-group">
            <label for="email">IDENTITY (EMAIL)</label>
            <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
          </div>
          
          <div class="input-group">
            <label for="password">PASSCODE</label>
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>

          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" id="remember">
              <span class="checkmark"></span>
              REMEMBER ACCESS
            </label>
            <a href="#" class="forgot-link">RECOVER?</a>
          </div>

          <button type="submit" class="btn btn-primary" id="btnLogin">
            <span class="btn-text">INITIALIZE LOGIN</span>
            <div class="spinner" id="loginSpinner"></div>
          </button>
          
          <button type="button" class="btn btn-secondary" id="btnRegister">
            CREATE NEW IDENTITY
          </button>
        </form>
      </div>
    </div>

  </div>

  <!-- 3. CHARACTER SELECTION SCREEN -->
  <div id="character-select">
    <div class="char-select-title">SELECT YOUR IDENTITY</div>
    
    <div class="character-card">
      <div class="character-avatar">&#128100;</div>
      <div class="character-name" id="charName">Fashion Architect</div>
      <div class="character-role">MANUFACTURER / LEVEL 1</div>
      
      <button class="btn-enter-world" id="btnEnterWorld">ENTER WORLD</button>
    </div>
  </div>

  <script>
    /**
     * =========================================
     * 1. CANVAS WORLD ENGINE
     * =========================================
     */
    const canvas = document.getElementById('game-world');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let camera = { x: 0, y: 0, targetX: 0, targetY: 0 };
    
    // Penyesuaian skala agar di HP tidak terlalu zoom in
    let scale = 1;
    const BASE_TILE_W = 64;
    const BASE_TILE_H = 32;

    function getTileW() { return BASE_TILE_W * scale; }
    function getTileH() { return BASE_TILE_H * scale; }
    
    const ORIGIN_X = () => width / 2;
    const ORIGIN_Y = () => height / 2 - 100;

    const buildings = [];
    const npcs = [];
    const vehicles = [];
    const particles = [];

    const colors = {
      bgTop: '#030508',
      bgBottom: '#0a1218',
      grid: 'rgba(0, 255, 204, 0.05)',
      buildingBase: '#0d141a',
      buildingTop: '#121b22',
      buildingStroke: '#00ffcc',
      buildingDetail: '#050a0e',
      vehicle: '#ff0055',
    };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      
      // Di layar HP, perkecil gedung agar kota terlihat lebih luas
      if (width < 768) {
        scale = 0.65; 
      } else {
        scale = 1;
      }
    }
    window.addEventListener('resize', resize);
    resize();

    function project(x, y, z) {
      const tw = getTileW();
      const th = getTileH();
      return {
        x: ORIGIN_X() + (x - y) * (tw / 2) - camera.x,
        y: ORIGIN_Y() + (x + y) * (th / 2) - (z * th) - camera.y
      };
    }

    function initCity() {
      buildings.length = 0; npcs.length = 0; vehicles.length = 0;
      
      for (let x = -10; x <= 10; x++) {
        for (let y = -10; y <= 10; y++) {
          if (x % 4 === 0 || y % 4 === 0) continue; 
          if (Math.random() > 0.75) continue;

          const heightZ = Math.floor(Math.random() * 5) + 2;
          buildings.push({
            x: x * 2, y: y * 2, z: heightZ,
            type: Math.random() > 0.8 ? 'factory' : 'shop',
            pulse: Math.random() * Math.PI * 2, speed: 0.01 + Math.random() * 0.02
          });
        }
      }

      for(let i=0; i<20; i++) {
        let npc = { x: (Math.random() - 0.5) * 30, y: (Math.random() - 0.5) * 30, targetX: 0, targetY: 0, speed: 0.02 + Math.random() * 0.03, color: `hsl(${Math.random() * 360}, 80%, 60%)` };
        resetNpcTarget(npc); npcs.push(npc);
      }

      for(let i=0; i<8; i++) {
        vehicles.push({ x: (Math.random() - 0.5) * 20, y: (Math.random() - 0.5) * 20, dir: Math.random() * Math.PI * 2, speed: 0.1 + Math.random() * 0.15 });
      }
    }

    function resetNpcTarget(npc) {
      npc.targetX = (Math.random() - 0.5) * 30;
      npc.targetY = (Math.random() - 0.5) * 30;
    }

    function drawGrid() {
      ctx.strokeStyle = colors.grid; ctx.lineWidth = 1 * scale; const extent = 30;
      for (let i = -extent; i <= extent; i++) {
        let p1 = project(i, -extent, 0); let p2 = project(i, extent, 0);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        let p3 = project(-extent, i, 0); let p4 = project(extent, i, 0);
        ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
      }
    }

    function drawBuilding(b) {
      const base = project(b.x, b.y, 0);
      const tw = getTileW(); const th = getTileH();
      const w = tw * 0.8; const h = th * 0.8; const bh = (b.z * th) * 0.9;

      ctx.fillStyle = colors.buildingBase;
      ctx.beginPath(); ctx.moveTo(base.x - w/2, base.y); ctx.lineTo(base.x, base.y + h/2); ctx.lineTo(base.x, base.y + h/2 - bh); ctx.lineTo(base.x - w/2, base.y - bh); ctx.fill();
      ctx.strokeStyle = colors.buildingDetail; ctx.lineWidth = 1 * scale; ctx.stroke();

      ctx.fillStyle = colors.buildingTop;
      ctx.beginPath(); ctx.moveTo(base.x, base.y + h/2); ctx.lineTo(base.x + w/2, base.y); ctx.lineTo(base.x + w/2, base.y - bh); ctx.lineTo(base.x, base.y + h/2 - bh); ctx.fill();
      ctx.strokeStyle = colors.buildingDetail; ctx.stroke();

      ctx.fillStyle = '#16222a';
      ctx.beginPath(); ctx.moveTo(base.x - w/2, base.y - bh); ctx.lineTo(base.x, base.y + h/2 - bh); ctx.lineTo(base.x + w/2, base.y - bh); ctx.lineTo(base.x, base.y - h/2 - bh); ctx.fill();

      const pulse = (Math.sin(Date.now() * b.speed + b.pulse) + 1) / 2;
      ctx.strokeStyle = b.type === 'factory' ? `rgba(255, 0, 85, ${0.3 + pulse * 0.7})` : `rgba(0, 255, 204, ${0.2 + pulse * 0.5})`;
      ctx.lineWidth = 2 * scale;
      
      ctx.beginPath(); ctx.moveTo(base.x - w/4, base.y + h/4); ctx.lineTo(base.x - w/4, base.y + h/4 - bh); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(base.x + w/4, base.y + h/4); ctx.lineTo(base.x + w/4, base.y + h/4 - bh); ctx.stroke();
    }

    function drawVehicle(v) {
      const p = project(v.x, v.y, 0.1);
      const s = scale; // skala
      ctx.fillStyle = colors.vehicle; ctx.shadowBlur = 15 * s; ctx.shadowColor = colors.vehicle;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 14 * s, 7 * s, Math.PI/4, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x + Math.cos(v.dir)*10*s, p.y + Math.sin(v.dir)*5*s, 2 * s, 0, Math.PI*2); ctx.fill();
    }

    function drawNPC(n) {
      const p = project(n.x, n.y, 0.3);
      const s = scale;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 6 * s, 3 * s, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = n.color; ctx.beginPath(); ctx.arc(p.x, p.y - 10 * s, 4 * s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y - 16 * s, 3 * s, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = n.color; ctx.lineWidth = 1 * s; ctx.beginPath(); ctx.arc(p.x, p.y - 10 * s, 8 * s, 0, Math.PI*2); ctx.stroke();
    }

    function update() {
      const time = Date.now() * 0.0005;
      camera.x = Math.sin(time) * 30; camera.y = Math.cos(time * 0.8) * 15;

      npcs.forEach(n => {
        const dx = n.targetX - n.x; const dy = n.targetY - n.y; const dist = Math.hypot(dx, dy);
        if (dist < 0.5) resetNpcTarget(n);
        else { n.x += (dx / dist) * n.speed; n.y += (dy / dist) * n.speed; }
      });

      vehicles.forEach(v => {
        v.x += Math.cos(v.dir) * v.speed; v.y += Math.sin(v.dir) * v.speed;
        if (Math.abs(v.x) > 25 || Math.abs(v.y) > 25) { v.dir += Math.PI; v.x += Math.cos(v.dir) * v.speed; v.y += Math.sin(v.dir) * v.speed; }
      });

      if (Math.random() < 0.15) {
        particles.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - 0.5) * 0.5, vy: -1 - Math.random() * 1, life: 1, decay: 0.01 + Math.random() * 0.02 });
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, colors.bgTop); bgGrad.addColorStop(1, colors.bgBottom);
      ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, width, height);

      drawGrid();

      const renderables = [...buildings, ...vehicles].sort((a, b) => (a.x + a.y) - (b.x + b.y));
      renderables.forEach(item => item.type ? drawBuilding(item) : drawVehicle(item));

      npcs.sort((a, b) => (a.x + a.y) - (b.x + b.y));
      npcs.forEach(drawNPC);

      ctx.fillStyle = '#00ffcc';
      particles.forEach(p => { ctx.globalAlpha = p.life; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5 * scale, 0, Math.PI*2); ctx.fill(); });
      ctx.globalAlpha = 1.0;

      // Vignette
      const vig = ctx.createRadialGradient(width/2, height/2, height*0.2, width/2, height/2, height);
      vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.fillStyle = vig; ctx.fillRect(0, 0, width, height);
    }

    function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }
    
    initCity(); gameLoop();

    /**
     * =========================================
     * 2. GAME UI FLOW LOGIC
     * =========================================
     */
    const initialLoader = document.getElementById('initial-loader');
    const loadProgress = document.getElementById('loadProgress');
    const loadText = document.getElementById('loadText');
    const uiLayer = document.getElementById('ui-layer');
    const loginPanel = document.getElementById('login-panel');
    const mainHeader = document.getElementById('mainHeader');
    const mainStatus = document.getElementById('mainStatus');
    const charSelectScreen = document.getElementById('character-select');
    const loginForm = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btnLogin');
    const loginSpinner = document.getElementById('loginSpinner');
    const btnText = btnLogin.querySelector('.btn-text');
    const charName = document.getElementById('charName');

    // FASE 1: INITIAL LOADING
    let progress = 0;
    const loadInterval = setInterval(() => {
      progress += Math.random() * 15;
      if (progress >= 100) {
        progress = 100;
        clearInterval(loadInterval);
        
        loadText.textContent = "CONNECTION ESTABLISHED";
        loadText.style.color = "#fff";
        
        setTimeout(() => {
          initialLoader.style.opacity = '0';
          setTimeout(() => {
            initialLoader.style.display = 'none';
            uiLayer.style.display = 'flex';
            
            // Tampilkan UI setelah loader hilang
            setTimeout(() => {
              mainHeader.style.opacity = '1';
              mainStatus.style.opacity = '1';
              loginPanel.classList.add('show');
            }, 100);
            
          }, 1000);
        }, 500);
      }
      loadProgress.style.width = progress + '%';
      
      if (progress > 30 && progress < 60) loadText.textContent = "LOADING WORLD ASSETS...";
      if (progress > 60 && progress < 90) loadText.textContent = "SYNCHRONIZING IDENTITY...";
      
    }, 150);

    // FASE 2: LOGIN PROCESS
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if(!email || !password) return;

      btnLogin.disabled = true;
      btnText.style.display = 'none';
      loginSpinner.style.display = 'block';

      setTimeout(() => {
        const displayName = email.split('@')[0];
        charName.textContent = displayName.charAt(0).toUpperCase() + displayName.slice(1);

        loginPanel.classList.remove('show');
        
        setTimeout(() => {
          uiLayer.style.opacity = '0'; 
          charSelectScreen.classList.add('active');
        }, 500);

      }, 2000);
    });

    document.getElementById('btnRegister').addEventListener('click', () => {
      alert("Membuka portal pembuatan akun baru (Integrasi Supabase Auth).");
    });

    // FASE 3: ENTER WORLD
    const btnEnterWorld = document.getElementById('btnEnterWorld');
    btnEnterWorld.addEventListener('click', () => {
      btnEnterWorld.textContent = 'LOADING WORLD...';
      btnEnterWorld.style.color = '#000';
      btnEnterWorld.style.background = 'var(--color-primary)';
      
      const flash = document.createElement('div');
      flash.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:999;opacity:0;transition:opacity 0.5s;pointer-events:none;';
      document.body.appendChild(flash);
      
      setTimeout(() => { flash.style.opacity = '1'; }, 50);

      setTimeout(() => {
        window.location.href = 'dashboard.html'; 
      }, 1000);
    });

  </script>
