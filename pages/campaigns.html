<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaigns — FastProduction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d0c;
  --panel: #121614;
  --panel2: #191e1b;
  --line: #29312c;
  --text: #edf2ed;
  --muted: #849087;
  --lime: #c5f36b;
  --mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
}
button, input, select, textarea { font: inherit; }
.topbar {
  height: 68px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5%;
}
.logo {
  font-weight: 800;
  letter-spacing: -1px;
  font-size: 18px;
  color: var(--text);
  text-decoration: none;
}
.logo span { color: var(--lime); }
.top-meta {
  color: var(--muted);
  font: 11px var(--mono);
}
.container {
  max-width: 1200px;
  margin: auto;
  padding: 38px 24px 80px;
}
.heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 30px;
}
.eyebrow {
  color: var(--lime);
  font: 11px var(--mono);
  letter-spacing: 2px;
  margin-bottom: 10px;
}
h1 {
  margin: 0;
  font-size: clamp(27px, 5vw, 42px);
  letter-spacing: -2px;
}
.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-top: 9px;
}
.filters {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.filters select, .filters input {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 12px;
  outline: none;
}
.filters select:focus, .filters input:focus {
  border-color: var(--lime);
}
.filters input {
  flex: 1;
  min-width: 200px;
}
.btn {
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}
.btn.primary {
  background: var(--lime);
  color: #11170d;
  border-color: var(--lime);
}
.btn:hover:not(:disabled) { opacity: .85; }
.campaigns-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.campaign-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 20px;
}
.campaign-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
.campaign-head h3 {
  margin: 0;
  font-size: 15px;
  letter-spacing: -.3px;
}
.campaign-head .design-name {
  color: var(--muted);
  font-size: 10px;
  margin-top: 4px;
  font-family: var(--mono);
}
.tag {
  color: var(--lime);
  border: 1px solid #52613d;
  padding: 5px 8px;
  border-radius: 4px;
  font: 9px var(--mono);
  white-space: nowrap;
}
.campaign-meta {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
}
.campaign-meta small {
  display: block;
  color: var(--muted);
  font: 9px var(--mono);
  letter-spacing: 1px;
  margin-bottom: 3px;
}
.campaign-meta b {
  font-size: 12px;
  display: block;
}
.campaign-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.campaign-actions select {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 7px 10px;
  font-size: 10px;
  font-family: var(--mono);
  cursor: pointer;
}
.campaign-actions select:focus {
  border-color: var(--lime);
  outline: none;
}
.empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 8px;
}
.empty strong {
  display: block;
  color: var(--lime);
  font-size: 14px;
  margin-bottom: 8px;
}
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 50;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-backdrop.show {
  display: flex;
}
.modal {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 24px;
  width: min(560px, 100%);
  max-height: 90vh;
  overflow: auto;
}
.modal h2 {
  margin: 0 0 18px 0;
  font-size: 17px;
  letter-spacing: -.5px;
}
.field-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.field { min-width: 0; }
.field.full { grid-column: 1 / -1; }
label {
  display: block;
  font-size: 11px;
  color: #b9c3bb;
  margin-bottom: 8px;
}
input, select, textarea {
  width: 100%;
  background: #0c100e;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 12px;
  outline: none;
  font-size: 12px;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--lime);
}
.actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}
@media(max-width: 760px) {
  .container { padding: 27px 15px 55px; }
  .heading { align-items: flex-start; flex-direction: column; }
  .campaigns-grid { grid-template-columns: 1fr; }
  .field-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
}
</style>
<link rel="stylesheet" href="../assets/css/navbar.css">
</head>
<body>
<header class="topbar">
<a href="../index.html" class="logo">FAST<span>PRODUCTION</span></a>
<div class="top-meta">CAMPAIGN MANAGEMENT / V1.0</div>
</header>
<main class="container">
<div class="heading">
<div>
<div class="eyebrow">DESIGN CAMPAIGNS</div>
<h1>Your Campaigns</h1>
<div class="subtitle">Kelola campaign untuk semua design Anda. Satu design bisa memiliki banyak campaign.</div>
</div>
<button type="button" class="btn primary" id="btn-new-campaign">＋ New Campaign</button>
</div>

<div class="filters">
<input type="text" id="search" placeholder="Cari campaign...">
<select id="filter-design">
<option value="">Semua Design</option>
</select>
<select id="filter-status">
<option value="">Semua Status</option>
<option value="draft">Draft</option>
<option value="open">Open</option>
<option value="closed">Closed</option>
<option value="cancelled">Cancelled</option>
</select>
</div>

<div class="campaigns-grid" id="campaigns-list"></div>

<div class="empty" id="empty-state" style="display:none;">
<strong>BELUM ADA CAMPAIGN</strong>
Buat campaign pertama untuk design Anda. Klik tombol "＋ New Campaign" untuk memulai.
</div>
</main>

<!-- Campaign Modal -->
<div class="modal-backdrop" id="campaignModal">
<div class="modal">
<h2 id="modal-title">New Campaign</h2>
<form id="campaignForm">
<div class="field-grid">
<div class="field full">
<label for="cmp-design">DESIGN *</label>
<select id="cmp-design" name="design_id" required>
<option value="">Pilih design</option>
</select>
</div>
<div class="field full">
<label for="cmp-title">JUDUL CAMPAIGN *</label>
<input id="cmp-title" name="title" maxlength="120" required placeholder="Contoh: Produksi November 2026">
</div>
<div class="field">
<label for="cmp-target">TARGET QUANTITY (PCS)</label>
<input id="cmp-target" name="target_qty" type="number" min="1" step="1" placeholder="Contoh: 500">
</div>
<div class="field">
<label for="cmp-min-interest">MIN INTEREST (ORANG)</label>
<input id="cmp-min-interest" name="min_interest" type="number" min="0" step="1" placeholder="Contoh: 50" value="0">
</div>
<div class="field">
<label for="cmp-interest-period">INTEREST PERIOD (HARI)</label>
<input id="cmp-interest-period" name="interest_period_days" type="number" min="1" step="1" placeholder="Contoh: 7">
</div>
<div class="field">
<label for="cmp-po-period">PO PAYMENT PERIOD (HARI)</label>
<input id="cmp-po-period" name="po_payment_period_days" type="number" min="1" step="1" placeholder="Contoh: 3">
</div>
<div class="field">
<label for="cmp-status">STATUS</label>
<select id="cmp-status" name="status">
<option value="draft">Draft</option>
<option value="open">Open</option>
<option value="closed">Closed</option>
<option value="cancelled">Cancelled</option>
</select>
</div>
<div class="field">
<label for="cmp-started">TANGGAL MULAI</label>
<input id="cmp-started" name="started_at" type="date">
</div>
<div class="field full">
<label for="cmp-ended">TANGGAL SELESAI</label>
<input id="cmp-ended" name="ended_at" type="date">
</div>
</div>
<div class="actions">
<button type="button" class="btn" id="btn-cancel">Batal</button>
<button type="submit" class="btn primary">Simpan Campaign</button>
</div>
</form>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/campaigns-standalone.js"></script>
<script src="../assets/js/transition.js"></script>
<script src="../assets/js/prayer-guard.js"></script>
<script src="../assets/js/music.js"></script>
<script src="../assets/js/navbar.js"></script>
</body>
</html>
